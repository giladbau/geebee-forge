<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape Sudoku — Quiet Garden Skin</title>
<style>
:root{
  --primary:#315f5a;--primary-hover:#274d49;--primary-soft:#ddece7;
  --canvas:#f5f2ec;--surface:#fffefb;--surface-muted:#eef3f0;--surface-clue:#e5ece8;
  --text:#263331;--muted:#586966;--border:#c6d2cd;--border-strong:#7f9690;
  --focus:#416f9d;--error:#944040;--error-soft:#f7dedc;
  --coral:#d97872;--blue:#6489c4;--rose:#c8759e;--honey:#c99c43;
  --shadow:0 16px 44px rgba(49,95,90,.10);--raised:0 5px 14px rgba(49,95,90,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
.page{min-height:100vh;padding:52px 24px 64px;display:grid;place-items:start center}
.panel{width:min(100%,800px);padding:30px 32px 28px;background:var(--surface);border:1px solid rgba(198,210,205,.75);border-radius:18px;box-shadow:var(--shadow)}
header{display:flex;align-items:end;justify-content:space-between;gap:24px}
.eyebrow{margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.065em;text-transform:uppercase}
h1{margin:0;font-family:ui-rounded,system-ui,sans-serif;font-size:clamp(34px,5vw,48px);font-weight:750;line-height:1;letter-spacing:-.035em}
.size-label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
select{height:44px;padding:0 38px 0 13px;color:var(--text);background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;font:650 14px system-ui;outline:none}
.instructions{margin:20px 0 16px;color:var(--muted);font-size:15px;line-height:1.5}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 18px}
.palette button{width:76px;height:68px;padding:7px;display:grid;place-items:center;gap:2px;color:var(--muted);background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;font:650 11px system-ui;text-transform:capitalize;box-shadow:none;cursor:pointer}
.palette button:hover{transform:translateY(-1px);box-shadow:var(--raised)}
.palette button.selected{color:var(--text);background:var(--primary-soft);border:2px solid var(--primary);box-shadow:0 0 0 3px rgba(49,95,90,.16)}
.palette svg{width:34px;height:34px;filter:drop-shadow(0 1px 0 rgba(38,51,49,.12))}
.eraser{font-size:26px;line-height:1;transform:rotate(-35deg)}
.board-bed{width:min(100%,500px);aspect-ratio:1;margin:auto;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface-muted);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden}
.cell{min-width:0;padding:12%;display:grid;place-items:center;background:var(--surface);border:0;border-radius:8px;cursor:pointer}
.cell:hover{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary)}
.cell.clue{position:relative;background:var(--surface-clue);cursor:default}
.cell.clue:after{content:"";position:absolute;right:7px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--border-strong);opacity:.7}
.cell svg{width:66%;height:66%;filter:drop-shadow(0 1px 0 rgba(38,51,49,.12))}
.status-slot{height:38px;display:grid;place-items:center;color:var(--error);font-size:14px;font-weight:650}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.actions button{height:44px;padding:0 18px;color:var(--text);background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;font:650 14px system-ui;cursor:pointer}
.actions button:hover{background:var(--primary-soft)}
.actions .primary{color:var(--surface);background:var(--primary);border-color:var(--primary)}
.actions .primary:hover{background:var(--primary-hover)}
button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
svg{display:block;overflow:visible}
@media(max-width:580px){.page{padding:18px 10px 30px}.panel{padding:22px 14px 20px}header{align-items:start;flex-direction:column;gap:14px}.size-label{width:100%}select{width:100%}.palette button{width:60px;height:58px;font-size:0}.palette svg{width:32px;height:32px}.board-bed{padding:6px;gap:2px}.cell{border-radius:5px}.actions button{flex:1;padding-inline:8px}}
</style>
</head>
<body>
<main class="page">
<section class="panel" aria-labelledby="title">
<header>
  <div><p class="eyebrow">A picture puzzle for curious minds</p><h1 id="title">Shape Sudoku</h1></div>
  <label class="size-label">Grid size<select aria-label="Grid size"><option>4 × 4</option></select></label>
</header>
<p class="instructions">Put each shape once in every row and column. Pick a shape, then pick a square.</p>
<div class="palette" aria-label="Shape palette">
  <button class="selected" aria-pressed="true"><svg viewBox="0 0 100 100"><polygon points="50,7 94,90 6,90" fill="var(--coral)"/></svg><span>triangle</span></button>
  <button><svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="5" fill="var(--blue)"/></svg><span>square</span></button>
  <button><svg viewBox="0 0 100 100"><path d="M50 91 11 52C-7 30 6 8 28 10c10 1 17 7 22 16 5-9 12-15 22-16 22-2 35 20 17 42Z" fill="var(--rose)"/><path d="m50 27-15 25 15 39 15-39Z" fill="rgba(255,255,255,.18)"/><path d="m11 52 24 0 15 39Z M89 52H65L50 91Z" fill="rgba(0,0,0,.08)"/></svg><span>heart</span></button>
  <button><svg viewBox="0 0 100 100"><polygon points="50,5 61,36 95,37 68,57 77,90 50,71 23,90 32,57 5,37 39,36" fill="var(--honey)"/></svg><span>star</span></button>
  <button><span class="eraser" aria-hidden="true">⌫</span><span>eraser</span></button>
</div>
<div class="board-bed" aria-label="4 by 4 Shape Sudoku grid">
  <button class="cell clue"><svg viewBox="0 0 100 100"><polygon points="50,5 61,36 95,37 68,57 77,90 50,71 23,90 32,57 5,37 39,36" fill="var(--honey)"/></svg></button>
  <button class="cell"></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="5" fill="var(--blue)"/></svg></button>
  <button class="cell"><svg viewBox="0 0 100 100"><polygon points="50,7 94,90 6,90" fill="var(--coral)"/></svg></button>
  <button class="cell"><svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="5" fill="var(--blue)"/></svg></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><polygon points="50,7 94,90 6,90" fill="var(--coral)"/></svg></button>
  <button class="cell"></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><path d="M50 91 11 52C-7 30 6 8 28 10c10 1 17 7 22 16 5-9 12-15 22-16 22-2 35 20 17 42Z" fill="var(--rose)"/><path d="m50 27-15 25 15 39 15-39Z" fill="rgba(255,255,255,.18)"/></svg></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><path d="M50 91 11 52C-7 30 6 8 28 10c10 1 17 7 22 16 5-9 12-15 22-16 22-2 35 20 17 42Z" fill="var(--rose)"/><path d="m50 27-15 25 15 39 15-39Z" fill="rgba(255,255,255,.18)"/></svg></button>
  <button class="cell"><svg viewBox="0 0 100 100"><polygon points="50,5 61,36 95,37 68,57 77,90 50,71 23,90 32,57 5,37 39,36" fill="var(--honey)"/></svg></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><polygon points="50,7 94,90 6,90" fill="var(--coral)"/></svg></button>
  <button class="cell"></button>
  <button class="cell"></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><path d="M50 91 11 52C-7 30 6 8 28 10c10 1 17 7 22 16 5-9 12-15 22-16 22-2 35 20 17 42Z" fill="var(--rose)"/><path d="m50 27-15 25 15 39 15-39Z" fill="rgba(255,255,255,.18)"/></svg></button>
  <button class="cell"><svg viewBox="0 0 100 100"><polygon points="50,5 61,36 95,37 68,57 77,90 50,71 23,90 32,57 5,37 39,36" fill="var(--honey)"/></svg></button>
  <button class="cell clue"><svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="5" fill="var(--blue)"/></svg></button>
</div>
<div class="status-slot" aria-live="polite"></div>
<div class="actions"><button>Hint</button><button>Reset</button><button class="primary">New Puzzle</button></div>
</section>
</main>
<script>
document.querySelectorAll('.palette button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.palette button').forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-pressed','false')});button.classList.add('selected');button.setAttribute('aria-pressed','true')}));
</script>
</body>
</html>
